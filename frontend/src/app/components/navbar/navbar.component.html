<nav class="navbar">
  <div class="navbar-left">
    <!-- Hamburger menu (mobile only) -->
    <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Logo / Brand -->
    <div class="nav-brand">
      <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="4" width="12" height="12" rx="2"></rect>
        <rect x="16" y="4" width="12" height="12" rx="2"></rect>
        <rect x="4" y="16" width="12" height="12" rx="2"></rect>
        <rect x="16" y="16" width="12" height="12" rx="2"></rect>
      </svg>
      <span>Vilicus</span>
    </div>
  </div>

  <div class="navbar-center">
    <!-- Account selector -->
    <select class="account-select" [value]="selectedAccount" (change)="onAccountChange($any($event).target.value)">
      <option *ngFor="let acct of accounts" [value]="acct.name">{{ acct.name }}</option>
    </select>
  </div>

  <div class="navbar-right">
    <!-- User avatar + name -->
    <div class="user-info">
      <div class="avatar">{{ userInitials }}</div>
      <span class="user-name">{{ userName }}</span>
    </div>

    <!-- Logout button -->
    <button class="logout-btn" (click)="logout()" aria-label="Logout" title="Logout">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</nav>
