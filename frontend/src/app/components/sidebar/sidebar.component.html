<!-- Sidebar backdrop (mobile only, click to close) -->
<div class="sidebar-backdrop" *ngIf="!isOpen" (click)="closeSidebar()"></div>

<!-- Sidebar nav panel -->
<aside class="sidebar" [class.open]="isOpen">
  <nav class="nav">
    <a *ngFor="let item of navItems"
       [routerLink]="item.route"
       routerLinkActive="active"
       (click)="closeSidebar()"
       class="nav-item">
      <span class="nav-icon" [attr.data-icon]="item.icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <!-- Icons will be drawn conditionally based on data-icon -->
          <template [ngSwitch]="item.icon">
            <!-- Grid icon (Dashboard) -->
            <ng-container *ngSwitchCase="'grid'">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </ng-container>
            <!-- Table icon (Transactions) -->
            <ng-container *ngSwitchCase="'table'">
              <path d="M3 10h18"></path>
              <path d="M3 19h18"></path>
              <path d="M13 3v16"></path>
            </ng-container>
            <!-- Upload icon (Import) -->
            <ng-container *ngSwitchCase="'upload'">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </ng-container>
            <!-- Card icon (Accounts) -->
            <ng-container *ngSwitchCase="'card'">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </ng-container>
            <!-- Bar chart icon (Analytics) -->
            <ng-container *ngSwitchCase="'bars'">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="5"></line>
              <line x1="6" y1="20" x2="6" y2="15"></line>
            </ng-container>
            <!-- Gear icon (Settings) -->
            <ng-container *ngSwitchCase="'gear'">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m0 5.08l-4.24 4.24M20 4.22l-4.24 4.24m0 5.08l4.24 4.24M1 12h6m6 0h6"></path>
            </ng-container>
          </template>
        </svg>
      </span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>
</aside>
