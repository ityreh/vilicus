<div class="dashboard">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <div class="date-range-selector">
      <div class="seg">
        <button class="seg-opt active">Last 30 days</button>
        <button class="seg-opt">This month</button>
        <button class="seg-opt">Last 3 months</button>
      </div>
    </div>
  </div>

  <!-- Account cards -->
  <div class="account-cards">
    <div class="card">
      <div class="card-kicker">Checking</div>
      <div class="card-title">$5,234.50</div>
      <div class="card-meta">Last import: Aug 15, 2026</div>
    </div>
    <div class="card">
      <div class="card-kicker">Savings</div>
      <div class="card-title">$12,000.00</div>
      <div class="card-meta">Last import: Aug 10, 2026</div>
    </div>
  </div>

  <!-- Charts + Recent transactions -->
  <div class="dashboard-grid">
    <div class="card">
      <h4>Spending by Category</h4>
      <p class="text-muted">[Donut chart to be implemented]</p>
    </div>
    <div class="card">
      <h4>Spending Trend</h4>
      <p class="text-muted">[Line chart to be implemented]</p>
    </div>
  </div>

  <div class="card">
    <h4>Recent Transactions</h4>
    <p class="text-muted">[Transaction table to be implemented]</p>
  </div>
</div>
