spring:
  application:
    name: vilicus-finance

  datasource:
    url: jdbc:postgresql://localhost:5432/vilicus
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL16Dialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    cors:
      allowed-origins: http://localhost:4200
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: '*'
      allow-credentials: true

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256}
  expiration: 900000  # 15 minutes in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.vilicus: DEBUG
    org.springframework.security: DEBUG
