spring:
  application:
    name: vilicus-finance

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: your-super-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256
  expiration: 900000
  refresh-expiration: 604800000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: WARN
    com.vilicus: DEBUG
